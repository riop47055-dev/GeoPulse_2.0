
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoPulse — вход</title>
  <link rel="stylesheet" href="/assets/index-RsGsDbTA.css">
  <style>
    #login-screen {
      position: fixed; inset: 0; z-index: 99999;
      display: grid; place-items: center;
      background: linear-gradient(135deg,#10152e,#123c68);
      font-family: Arial,sans-serif; color: white;
    }
    .login-card {
      width: min(340px,85vw); padding: 36px;
      border-radius: 20px; background: #ffffff14;
      border: 1px solid #ffffff30;
    }
    .login-card h1 { text-align: center; }
    .login-card input, .login-card button {
      box-sizing: border-box; width: 100%; padding: 14px;
      margin-top: 12px; border-radius: 9px; font-size: 15px;
    }
    .login-card input { border: 1px solid #ffffff50; }
    .login-card button {
      background: #36a9ff; color: white; border: 0;
      cursor: pointer; font-weight: bold;
    }
    #login-error { color: #ffb3b3; min-height: 20px; }
  </style>
  <script type="module" crossorigin src="/assets/index-BzByXPHP.js"></script>
</head>
<body>
  <div id="root"></div>

  <div id="login-screen">
    <form class="login-card" id="login-form">
      <h1>🌍 GeoPulse</h1>
      <p style="text-align:center">Вход в систему</p>
      <input id="username" placeholder="Логин" required>
      <input id="password" type="password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
      <p id="login-error"></p>
      <small>Демонстрационная версия</small>
    </form>
  </div>

  <script>
    const screen = document.getElementById("login-screen");
    if (sessionStorage.getItem("geopulse-demo-login") === "yes") {
      screen.remove();
    }
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "demo" && pass === "GeoPulse2026!") {
        sessionStorage.setItem("geopulse-demo-login", "yes");
        screen.remove();
      } else {
        document.getElementById("login-error").textContent =
          "Неверный логин или пароль";
      }
    });
  </script>
</body>
</html>
